# ═══════════════════════════════════════════════════════════════
#  AlgoForge Staging Bootstrap Nginx Config — staging.philforge.in
#  HTTP only. Use this first so the staging app is reachable and
#  Let's Encrypt can be issued safely without touching live vhosts.
# ═══════════════════════════════════════════════════════════════

upstream algoforge_staging_backend {
    server 127.0.0.1:8002;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name staging.philforge.in;

    client_max_body_size 12m;

    location /api/scalp/ {
        proxy_pass         http://algoforge_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 2s;
    }

    location /api/ {
        proxy_pass         http://algoforge_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass         http://algoforge_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass         http://algoforge_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
