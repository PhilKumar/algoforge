# ═══════════════════════════════════════════════════════════════
#  PhilForge Nginx Config — philforge.in
#
#  Upstream is defined in /etc/nginx/conf.d/philforge-upstream.conf
#  and swapped automatically by cd-deploy.sh during deployments.
# ═══════════════════════════════════════════════════════════════

# Fallback upstream — overridden by philforge-upstream.conf
# (only used if the upstream file hasn't been created yet)
upstream philforge_backend_default {
    server 127.0.0.1:8000;
    keepalive 16;              # persistent connections to uvicorn
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name philforge.in www.philforge.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name philforge.in www.philforge.in;

    # ── TCP Latency Tuning ──────────────────────────────────
    tcp_nodelay on;            # disable Nagle — send small packets immediately
    tcp_nopush  on;            # combine headers into one packet (works with sendfile)

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://api.qrserver.com; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self'; manifest-src 'self'; frame-src 'none'; upgrade-insecure-requests; block-all-mixed-content;" always;

    # Allow chart screenshot uploads up to 12 MB
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/philforge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philforge.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── HOT PATH: Scalp execution (minimal overhead) ────────
    location /api/scalp/ {
        proxy_pass         http://philforge_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 2s;
    }

    # Long-running backfill endpoint
    location /api/portfolio/backfill {
        proxy_pass         http://philforge_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # API traffic
    location /api/ {
        proxy_pass         http://philforge_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket (live trading) — long timeout preserves connections
    location /ws {
        proxy_pass         http://philforge_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # Health check
    location /health {
        proxy_pass http://philforge_backend;
    }

    # Catch-all (HTML pages, static assets, login, etc.)
    location / {
        proxy_pass         http://philforge_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
