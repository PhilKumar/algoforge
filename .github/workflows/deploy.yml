# ═══════════════════════════════════════════════════════════════
#  AlgoForge — Push-to-Deploy (Zero Downtime, Blue-Green)
# ═══════════════════════════════════════════════════════════════
name: Deploy AlgoForge

on:
  workflow_run:
    workflows: ["Playwright E2E"]
    types: [completed]
  workflow_dispatch:        # manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one deploy at a time — never cancel a running deploy
concurrency:
  group: deploy-algoforge
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Run zero-downtime deploy
        run: |
          TARGET_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          set +e
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -T"
          ssh $SSH_OPTS deploy-target "cd ~/algoforge && git fetch origin main && git checkout main && git reset --hard ${TARGET_SHA} && bash deploy/cd-deploy.sh" \
            2>deploy-stderr.log | tee deploy-stdout.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          if [ "$rc" -eq 255 ] && grep -Eq 'Broken pipe|Connection .* closed|timed out|banner exchange' deploy-stderr.log; then
            echo "SSH transport dropped during deploy. Verifying remote state..."
            ssh $SSH_OPTS deploy-target "REMOTE_HEAD=\$(git -C ~/algoforge rev-parse HEAD); ACTIVE_PORT=\$(cat ~/.algoforge-active-port); test \"\$REMOTE_HEAD\" = \"${TARGET_SHA}\" && curl -sf http://127.0.0.1:\${ACTIVE_PORT}/api/health >/dev/null"
            echo "Remote deploy verified after SSH disconnect."
            exit 0
          fi

          cat deploy-stderr.log
          exit "$rc"

      - name: Verify deployment
        run: |
          TARGET_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -T"
          for i in $(seq 1 10); do
            if ssh $SSH_OPTS deploy-target "REMOTE_HEAD=\$(git -C ~/algoforge rev-parse HEAD); ACTIVE_PORT=\$(cat ~/.algoforge-active-port); test \"\$REMOTE_HEAD\" = \"${TARGET_SHA}\" && curl -sf http://127.0.0.1:\${ACTIVE_PORT}/api/health >/dev/null && echo \" ✅ Health OK on port \${ACTIVE_PORT}\""; then
              exit 0
            fi
            sleep 3
          done
          echo " ❌ Health verification failed after deploy"
          exit 1

      - name: Post-deploy summary
        if: always()
        run: |
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -T"
          ssh $SSH_OPTS deploy-target "echo '── AlgoForge Deploy Status ──' && echo 'State:' \$(systemctl is-active algoforge@\$(cat ~/.algoforge-active-port)) && echo 'Active port:' \$(cat ~/.algoforge-active-port)" || true
