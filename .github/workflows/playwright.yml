name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-algoforge:
    name: E2E — AlgoForge
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ── Python (for the FastAPI dev server) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      # ── Node.js (for Playwright) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright deps
        working-directory: e2e-tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      # ── Start AlgoForge server ──
      - name: Start AlgoForge dev server
        env:
          ALGOFORGE_PIN: "123456"
          DHAN_CLIENT_ID: "e2e-dummy"
          DHAN_ACCESS_TOKEN: "e2e-dummy-token"
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health > /dev/null || (echo "Server failed to start" && exit 1)
          echo "AlgoForge is up on :8000"

      # ── Run Playwright tests ──
      - name: Run Playwright tests
        env:
          E2E_PIN: "123456"
        working-directory: e2e-tests
        run: npx playwright test --project=algoforge

      # ── Upload artifacts on failure ──
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-algoforge
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          retention-days: 14
